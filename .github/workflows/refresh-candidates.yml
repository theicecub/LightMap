name: Refresh building candidates

on:
  schedule:
    # Каждый понедельник в 03:00 UTC (08:00 в Астане)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/refresh-candidates.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
